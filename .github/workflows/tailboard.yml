name: tailboard

on:
  push:
    paths: ["tailboard/**", ".github/workflows/tailboard.yml"]
  pull_request:
    paths: ["tailboard/**", ".github/workflows/tailboard.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tailboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tailboard/web/package-lock.json
      - run: go test ./...
      - run: npm ci && npm run build
        working-directory: tailboard/web
      - run: go build -o /tmp/tailboard ./cmd/tailboard
